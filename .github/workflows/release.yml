name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Releases and the Homebrew Cask both live in this repository, so the built-in GITHUB_TOKEN is all
# the workflow needs. `contents: write` lets it create the release and commit Casks/vibe-db.rb.
permissions:
  contents: write

env:
  # Kept only while copies installed before the move still check these repositories for updates —
  # see docs/features/updates.md. Delete the RELEASES_TOKEN secret and the `legacy` job skips itself.
  LEGACY_RELEASE_REPOSITORY: khanhsnd/vibe-db-releases
  LEGACY_TAP_REPOSITORY: khanhsnd/homebrew-tap

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $installer = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installed but makensis.exe was not found' }
          $installer.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify NSIS
        shell: pwsh
        run: |
          $installer = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($null -eq $installer) { throw 'makensis.exe is not on PATH' }
          & $installer.Source /VERSION
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Set release version
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json
      - name: Build Windows installer
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          wails build -platform windows/amd64 -nsis -ldflags "-X main.version=$version"
          $installer = Get-ChildItem build/bin -Filter '*-installer.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Wails did not produce an NSIS installer' }
          Copy-Item $installer.FullName "build/bin/vibe-db-$version-windows-x64-setup.exe"
      # The installer only copies this one self-contained exe into Program Files, so the same exe in a
      # ZIP is the portable build: unzip and run, no installer, no elevation prompt.
      - name: Package portable Windows build
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $exe = 'build/bin/vibe-db.exe'
          if (-not (Test-Path $exe)) { throw 'Wails did not produce vibe-db.exe' }
          $staging = "build/portable/vibe-db-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe "$staging/vibe-db.exe"
          Compress-Archive -Path $staging -DestinationPath "build/bin/vibe-db-$version-windows-x64-portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/bin/vibe-db-*-windows-x64-setup.exe
            build/bin/vibe-db-*-windows-x64-portable.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Set release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('wails.json')); p.info.productVersion=process.env.VERSION.replace(/^v/,''); fs.writeFileSync('wails.json', JSON.stringify(p,null,2)+'\n')"
      - name: Build universal macOS app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          wails build -platform darwin/universal -ldflags "-X main.version=$version"
          ditto -c -k --sequesterRsrc --keepParent build/bin/vibe-db.app "build/bin/vibe-db-$version-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/bin/vibe-db-*-macos-universal.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install WebKit
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Set release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('wails.json')); p.info.productVersion=process.env.VERSION.replace(/^v/,''); fs.writeFileSync('wails.json', JSON.stringify(p,null,2)+'\n')"
      - name: Build Linux archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          wails build -platform linux/amd64 -ldflags "-X main.version=$version"
          staging="vibe-db-$version-linux-x64"
          mkdir -p "$staging"
          cp build/bin/vibe-db "$staging/vibe-db"
          cp build/linux/vibe-db.desktop "$staging/vibe-db.desktop"
          cp build/appicon.png "$staging/vibe-db.png"
          tar -czf "build/bin/$staging.tar.gz" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/bin/vibe-db-*-linux-x64.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum vibe-db-* > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vibe DB ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  update-cask:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist
      - name: Write Cask
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          sha256=$(sha256sum "dist/vibe-db-$version-macos-universal.zip" | cut -d ' ' -f 1)
          .github/scripts/write-cask.sh "$version" "$sha256" Casks/vibe-db.rb
      - name: Commit Cask
        run: |
          git config user.name 'vibe-db release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/vibe-db.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(cask): update vibe-db to ${{ github.ref_name }}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  # Copies installed before releases moved here still ask khanhsnd/vibe-db-releases for an update,
  # and Homebrew users still read khanhsnd/homebrew-tap. Mirroring each release there lets them
  # reach a version that looks here instead. Remove the RELEASES_TOKEN secret once that is done
  # and every step below is skipped; the two repositories can then be deleted.
  legacy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_TOKEN == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        if: env.HAS_TOKEN == 'true'
        working-directory: dist
        run: sha256sum vibe-db-* > checksums.txt
      - name: Mirror release
        if: env.HAS_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.LEGACY_RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: master
          name: Vibe DB ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}. Releases now live at https://github.com/khanhsnd/vibe-db/releases.
          files: dist/*
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          repository: ${{ env.LEGACY_TAP_REPOSITORY }}
          token: ${{ secrets.RELEASES_TOKEN }}
          path: tap
      - name: Update legacy Cask
        if: env.HAS_TOKEN == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          sha256=$(sha256sum "dist/vibe-db-$version-macos-universal.zip" | cut -d ' ' -f 1)
          .github/scripts/write-cask.sh "$version" "$sha256" tap/Casks/vibe-db.rb
          cd tap
          git config user.name 'vibe-db release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/vibe-db.rb
          git diff --cached --quiet || git commit -m "Update vibe-db to ${{ github.ref_name }}"
          git push
