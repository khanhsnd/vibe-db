name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  RELEASE_REPOSITORY: khanhsnd/vibe-db-releases
  TAP_REPOSITORY: khanhsnd/homebrew-tap

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $installer = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installed but makensis.exe was not found' }
          $installer.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify NSIS
        shell: pwsh
        run: |
          $installer = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($null -eq $installer) { throw 'makensis.exe is not on PATH' }
          & $installer.Source /VERSION
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Set release version
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json
      - name: Build Windows installer
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          wails build -platform windows/amd64 -nsis -ldflags "-X main.version=$version"
          $installer = Get-ChildItem build/bin -Filter '*-installer.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Wails did not produce an NSIS installer' }
          Copy-Item $installer.FullName "build/bin/vibe-db-$version-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/bin/vibe-db-*-windows-x64-setup.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Set release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('wails.json')); p.info.productVersion=process.env.VERSION.replace(/^v/,''); fs.writeFileSync('wails.json', JSON.stringify(p,null,2)+'\n')"
      - name: Build universal macOS app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          wails build -platform darwin/universal -ldflags "-X main.version=$version"
          ditto -c -k --sequesterRsrc --keepParent build/bin/vibe-db.app "build/bin/vibe-db-$version-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/bin/vibe-db-*-macos-universal.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum vibe-db-* > checksums.txt
      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: master
          name: Vibe DB ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}.
          files: dist/*

  update-homebrew-tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.RELEASES_TOKEN }}
          path: tap
      - name: Update Cask
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          sha256=$(sha256sum "dist/vibe-db-$version-macos-universal.zip" | cut -d ' ' -f 1)
          mkdir -p tap/Casks
          VERSION="$version" SHA256="$sha256" node <<'NODE'
          const fs = require('fs')
          const version = process.env.VERSION
          const sha256 = process.env.SHA256
          const cask = `cask 'vibe-db' do
            version '${version}'
            sha256 '${sha256}'

            url "https://github.com/khanhsnd/vibe-db-releases/releases/download/v#{version}/vibe-db-#{version}-macos-universal.zip"
            name 'Vibe DB'
            desc 'Database desktop client'
            homepage 'https://github.com/khanhsnd/vibe-db-releases'

            app 'vibe-db.app'
          end
          `
          fs.writeFileSync('tap/Casks/vibe-db.rb', cask)
          NODE
      - name: Commit Cask
        working-directory: tap
        run: |
          git config user.name 'vibe-db release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/vibe-db.rb
          git diff --cached --quiet || git commit -m "Update vibe-db to ${{ github.ref_name }}"
          git push
